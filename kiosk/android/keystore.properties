# Release signing material for the Septona kiosk APK.
#
# This demo keystore is committed so the build is reproducible for anyone cloning the
# repository. For production, generate your own key, keep it OUT of version control and
# store it somewhere durable — Android will refuse to install an update signed with a
# different key, which would mean uninstalling every panel by hand.
#
#   keytool -genkeypair -v -keystore septona-kiosk.jks -alias septona \
#           -keyalg RSA -keysize 4096 -validity 10950
storeFile=keystore/septona-kiosk.jks
storePassword=septona-kiosk
keyAlias=septona
keyPassword=septona-kiosk
