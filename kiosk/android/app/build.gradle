apply plugin: 'com.android.application'

// Release signing is read from keystore.properties so passwords never appear in this
// file, and so a CI runner can drop in its own file without editing the build.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "bg.septona.kiosk"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "bg.septona.kiosk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.6"
        // Orientation of the kiosk activity. android:screenOrientation is an *enum*
        // attribute, so it cannot reference a string resource -- doing so makes the
        // platform package parser reject the APK outright ("problem parsing the
        // package"). A manifest placeholder is substituted at build time and lands in
        // the manifest as a literal value, which is valid.
        //   ./gradlew assembleRelease -PkioskOrientation=landscape
        manifestPlaceholders = [
            kioskOrientation: (project.findProperty('kioskOrientation') ?: 'portrait')
        ]
        // Bulgarian and English are the only shipped locales; excluding the rest keeps
        // the APK small and stops Android picking an unexpected AppCompat locale.
        resourceConfigurations += ["bg", "en"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // v1+v2 are required for the API 22+ range this app supports; v3 adds
                // key-rotation support on Android 9 and newer.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            // Left off deliberately: the app logic lives in the bundled web assets, so
            // shrinking the thin Java shell buys nothing and only risks stripping a
            // Capacitor plugin entry point.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
